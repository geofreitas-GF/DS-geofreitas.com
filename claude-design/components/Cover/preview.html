<!-- @dsCard height=300 -->
<div style="position: relative; width: 960px; height: 300px; overflow: hidden; background: var(--gf-bg-canvas); font-family: var(--font-sans);">
  <style>
    .cv-ink { fill: var(--gf-text-primary); }
    .cv-ground { fill: var(--gf-bg-canvas); }
    .cv-Raggio { fill: var(--gf-raggio); }
    .cv-tint { fill: var(--gf-bg-layer-2); }
  </style>
  <svg width="960" height="112" viewBox="0 0 960 112" aria-hidden="true" style="position: absolute; left: 0; top: 0; display: block;">
    <!-- blocks: gf-text-primary slab 520×112 (bleeds top-left) · gf-raggio pill 256×64 (gf-space-64 ×4, rx = 32) · gf-bg-layer-2 tint 136×112 (bleeds top-right) -->
    <!-- arrangement: top band, unequal horizontal strip — name too wide for the 440px zone (17 chars at 64px), so the band skeleton -->
    <!-- pattern: pills from gf-radius-pill, cut from the slab in gf-bg-canvas — the pill is the system's protected interactive shape -->
    <!-- steps: pill 32×16 (gf-space-32 × gf-space-16, rx 8), pitch gf-space-48, insets gf-space-24; radii gf-radius-pill -->
    <rect class="cv-ink" x="0" y="0" width="520" height="112"/>
    <g class="cv-ground">
      <rect x="24" y="48" width="32" height="16" rx="8"/><rect x="72" y="48" width="32" height="16" rx="8"/><rect x="120" y="48" width="32" height="16" rx="8"/><rect x="168" y="48" width="32" height="16" rx="8"/><rect x="216" y="48" width="32" height="16" rx="8"/>
      <rect x="264" y="48" width="32" height="16" rx="8"/><rect x="312" y="48" width="32" height="16" rx="8"/><rect x="360" y="48" width="32" height="16" rx="8"/><rect x="408" y="48" width="32" height="16" rx="8"/><rect x="456" y="48" width="32" height="16" rx="8"/>
    </g>
    <rect class="cv-Raggio" x="544" y="24" width="256" height="64" rx="32"/>
    <rect class="cv-tint" x="824" y="0" width="136" height="112"/>
  </svg>
  <div style="position: absolute; left: 48px; bottom: 40px; max-width: 864px;">
    <div style="font-size: 64px; line-height: 0.95; font-weight: 700; letter-spacing: -0.02em; color: var(--gf-text-primary);">DS-geofreitas.com</div>
    <div style="margin-top: 16px; font-size: 14px; color: var(--gf-text-secondary);">The brand says it. The experience proves it.</div>
  </div>
</div>
